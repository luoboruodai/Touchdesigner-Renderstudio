name: FFmpeg bootstrap smoke

on:
  push:
    branches: [main]
    paths:
      - 'source/**'
      - '.github/workflows/bootstrap-smoke.yml'
  pull_request:
    paths:
      - 'source/**'
      - '.github/workflows/bootstrap-smoke.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  smoke:
    name: ${{ matrix.os }} managed download and encode
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, macos-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Pure rules
        run: python source/test_rules.py
      - name: Real managed download and H.264/AAC encode
        run: python source/test_bootstrap_smoke.py
        env:
          PYTHONIOENCODING: utf-8
